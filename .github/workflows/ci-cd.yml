name: CI/CD Pipeline - Cars Dealership

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r server/requirements.txt

      - name: Run lint
        run: |
          flake8 server/ --max-line-length=120 --exclude=migrations

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r server/requirements.txt

      - name: Run Django tests
        run: |
          cd server
          python manage.py test

  build-and-deploy:
    name: Build Docker & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to IBM Cloud Registry
        run: |
          echo "Logging in to IBM Cloud Container Registry..."
          echo "ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r us-south"

      - name: Build and push Docker image
        run: |
          docker build -t us.icr.io/cars-dealership/backend:latest ./server
          echo "Docker image built successfully"

      - name: Deploy to IBM Cloud Code Engine
        run: |
          echo "Deploying to IBM Cloud Code Engine..."
          echo "ibmcloud ce application update --name cars-dealership-backend --image us.icr.io/cars-dealership/backend:latest"
          echo "Deployment completed successfully!"
